<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나무 길 보드게임</title>
<link rel="icon" href="images/leaf2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="title"><img src="images/leaf2.png" alt=""><span id="title">나무 길 보드게임</span></h1>
    <div class="top-actions">
      <button class="btn" id="btnFull" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>전체 화면</button>
      <button class="btn" id="btnReset" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg>처음부터</button>
      <button class="btn berry" id="btnBloom" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.6"/><path d="M12 9.4C10 6 11 3.5 12 3c1 .5 2 3 0 6.4zM14.6 12c3.4-2 5.9-1 6.4 0-.5 1-3 2-6.4 0zM12 14.6c2 3.4 1 5.9 0 6.4-1-.5-2-3 0-6.4zM9.4 12C6 14 3.5 13 3 12c.5-1 3-2 6.4 0z"/></svg>꽃 피우기</button>
      <button class="btn sky" id="btnSettings" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>설정</button>
    </div>
  </header>

  <main class="board-wrap" aria-label="게임판">
    <div id="board"></div>
  </main>

  <aside class="side" aria-label="나무 요정과 모둠">
    <section class="fairy-card" aria-live="polite">
      <div class="fairy-row">
        <div class="fairy-pic"><img id="fairyImg" src="images/fairy-guide.jpg" alt="나무 요정"></div>
        <p class="bubble" id="fairyText"></p>
      </div>
      <div class="fairy-tools">
        <button class="btn" id="btnSayFairy" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6L8 10H4z"/><path d="M16.5 9a4 4 0 0 1 0 6"/></svg>읽어 주기</button>
        <button class="btn" id="btnHowto" type="button">게임 방법</button>
      </div>
    </section>
    <section class="teams">
      <p class="class-tree" id="classTree"></p>
      <h2>모둠 자동차</h2>
      <div id="teamList"></div>
      <p class="sync-badge" id="syncBadge"></p>
    </section>
  </aside>
</div>

<div id="layer"></div>

<script src="firebase-config.js"></script>
<script src="js/data.js"></script>
<script src="js/board-view.js"></script>
<script src="js/sync.js"></script>
<script src="js/scan.js"></script>
<script src="js/app-board.js"></script>
</body>
</html>
